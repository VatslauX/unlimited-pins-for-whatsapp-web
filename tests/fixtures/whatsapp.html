<!doctype html>
<!-- Mock of WhatsApp Web for the e2e tests: the fake internals (fake-whatsapp.js) plus a chat list.
     Switches, set before the page's scripts run (page.addInitScript):
       window.__MOCK_CHATS    the chat list (default below: 3 native pins, 4 unpinned chats)
       window.__MOCK_LOAD_MS  when WhatsApp's modules become available (default 300 ms)
       window.__MOCK_REACT    also draw the chat list with React like WhatsApp (for rows.js), in
                              #chat-list-root, __MOCK_LIST_MS after the modules load (default 1000; about 2500 live)
     The test drives it through window.__wa (ui.menu, ui.shortcut, ui.resync, serverCalls, ...). -->
<html>
<head>
  <meta charset="utf-8">
  <title>WhatsApp</title>
  <style>
    body { font: 14px sans-serif; margin: 0; }
    #pane-side { width: 320px; }
    .row { padding: 8px 12px; border-bottom: 1px solid #eee; }
    .row[data-pinned="true"]::after { content: " \1F4CC"; }
  </style>
</head>
<body>
  <div id="pane-side" role="grid" aria-label="Chat list"></div>
  <script src="/mock/react.js"></script>
  <script src="/mock/fake-whatsapp.js"></script>
  <script>
    (function () {
      const T0 = 1774270178963;
      const chats = window.__MOCK_CHATS || [
        { id: 'p1@c.us', name: 'Native one', pin: T0 + 3, t: 100 },
        { id: 'p2@c.us', name: 'Native two', pin: T0 + 2, t: 90 },
        { id: 'p3@g.us', name: 'Native three', pin: T0 + 1, t: 80 },
        { id: 'a@c.us', name: 'Alice', t: 70 },
        { id: 'b@c.us', name: 'Bob', t: 60 },
        { id: 'c@g.us', name: 'Club', t: 50 },
        { id: 'd@lid', name: 'Dana', t: 40 }
      ];
      const wa = createWhatsApp({
        chats, window, loadAfterMs: window.__MOCK_LOAD_MS ?? 300,
        react: window.__MOCK_REACT ? window.__mockReact : undefined, listAfterMs: window.__MOCK_LIST_MS ?? 1000
      });
      window.__wa = wa;
      const list = document.getElementById('pane-side');
      function render() {
        list.textContent = '';
        for (const c of wa.Chat.getModelsArray()) {
          const row = document.createElement('div');
          row.className = 'row';
          row.dataset.id = String(c.id);
          row.dataset.pinned = String(!!c.pin);
          row.textContent = c.name;
          list.appendChild(row);
        }
      }
      // registered before the extension's own listeners (it loads at document_idle), so the list
      // re-sorts first, like WhatsApp's: a set() the extension makes inside the same event is not
      // shown until the next one
      wa.Chat.on('change:pin', render);
      wa.Chat.on('add', render);
      render();
    })();
  </script>
</body>
</html>
