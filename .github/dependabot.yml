# Dependabot keeps the SHA-pinned GitHub Actions and the dev dependencies current.
# The actions in .github/workflows/ are pinned to commit SHAs (supply-chain hardening):
# a mutable tag can be moved to different code. Dependabot rewrites the SHA and the
# `# vX.Y.Z` comment together, so pinning stays maintainable.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # Minor and patch bumps travel together; a major gets its own PR, so one
      # breaking action cannot hold back routine pin refreshes.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The extension ships no runtime dependencies; these are test and lint tools only.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      # Same split: eslint and typescript majors change lint rules and type
      # diagnostics, so they need their own PR rather than blocking a patch batch.
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]
